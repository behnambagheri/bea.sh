image:
  repository: ghcr.io/behnambagheri/bea.sh
  # Empty uses the chart's appVersion, which CI sets to the matching sha-<commit> image.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The site is static, so replicas are interchangeable.
replicaCount: 2

service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bea.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
