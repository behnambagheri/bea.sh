map $http_user_agent $cli_ua {
  ~*(curl|wget|httpie) 1;
  default 0;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    if ($cli_ua) {
      add_header Content-Type text/plain;
      return 200 "Behnam Bagheri — DevOps Engineer\nLocation: Tehran, Iran (Hybrid)\nEmail: bagheri@linuxmail.org\nLinkedIn: linkedin.com/in/behnambagheri\nSite: behnambagheri.ir\n\nSummary:\nDevOps Engineer with 6+ years designing, operating, and automating on-prem Kubernetes clusters, CI/CD pipelines, monitoring/alerting, and DR.\n\nExperience — Bitmax (2021–Present):\n- Ran 6+ node on-prem Kubernetes clusters for microservices.\n- Built 30+ CI/CD pipelines (Bamboo + Bitbucket) for backend/frontend.\n- Authored Bash/Python automation for backups, reporting, workflows.\n- Wired webhooks across Bamboo/Bitbucket/Jira/Sentry for deploy + incident signals.\n- Built monitoring/alerting with Prometheus/Grafana/Alertmanager.\n- Responded to hardware/db/network incidents with rapid recovery and tested runbooks.\n- Designed rollback/restore mechanisms and PostgreSQL playbooks.\n\nCore Skills:\nLinux (prod), CI/CD (Bamboo, Bitbucket, Git), Docker/Kubernetes (on-prem),\nMonitoring (Prometheus, Grafana, Alertmanager), Backup/DR, Automation (Bash, Python),\nInfrastructure & Networking (on-prem)\n";
    }

    try_files $uri $uri/ /index.html;
  }
}
