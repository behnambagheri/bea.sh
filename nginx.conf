map $http_user_agent $cli_ua {
  ~*(curl|wget|httpie) 1;
  default 0;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    if ($cli_ua) {
      add_header Content-Type text/plain;
      return 200 "Hello, CLI engineer. Deployment is green; kubectl apply --prune responsibly. Here’s your 200 OK.\n";
    }

    try_files $uri $uri/ /index.html;
  }
}
