map $http_user_agent $cli_ua {
  ~*(curl|wget|httpie) 1;
  default 0;
}

map $http_accept $wants_markdown {
  ~*text/markdown 1;
  default 0;
}

# CLI clients (and agents that fetch with them) or Markdown-preferring clients get the profile as text.
map "$cli_ua$wants_markdown" $plain_profile {
  00 0;
  default 1;
}

# The same URL serves HTML or text depending on the client, so it must not be shared-cached.
# Empty values make nginx skip the header for every other path.
map $request_uri $root_cache_control {
  / no-store;
  default '';
}

map $request_uri $root_vary {
  / 'User-Agent, Accept';
  default '';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # www duplicates the canonical host, so send visitors and crawlers to bea.sh.
  if ($host = www.bea.sh) {
    return 301 https://bea.sh$request_uri;
  }

  # Advertise the Markdown profile so AI agents can find it from any response.
  add_header Link '</llms.txt>; rel="describedby"; type="text/markdown", </sitemap.xml>; rel="sitemap"; type="application/xml"' always;
  add_header Cache-Control $root_cache_control always;
  add_header Vary $root_vary always;

  location = / {
    if ($plain_profile) {
      rewrite ^ /llms.txt last;
    }

    try_files /index.html =404;
  }

  # Design system: other domains load its CSS and fonts, so allow CORS and cache for a week.
  # add_header here replaces the server-level headers, so Link is repeated.
  location /ds/v1/ {
    add_header Link '</llms.txt>; rel="describedby"; type="text/markdown", </sitemap.xml>; rel="sitemap"; type="application/xml"' always;
    add_header Access-Control-Allow-Origin '*' always;
    add_header Cache-Control 'public, max-age=604800, stale-while-revalidate=86400' always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
